| **MS-06** | Tema Uyumu | ✅ Geçti | Varsayılan olarak aydınlık tema ile başlamakta; kullanıcı seçimiyle koyu temaya geçiş yapılabilmekte ve kontrast korunmaktadır. |
| **MS-07** | Responsive / Mobil Akış | ✅ Geçti | Viewport meta etiketi tanımlıdır. 900px altındaki ekranlarda dikey düzen ve dokunmatik manipülasyon akıcı çalışmaktadır. |
| **MS-08** | Erişilebilirlik & Odak | ⚠️ Kısmi | Düğmelerde \`:focus-visible\` ve klavye sekme erişimi mevcuttur; ancak 3D sahnedeki hareketli tutamaçlar ok tuşlarıyla kaydırılamamaktadır. |
| **MS-09** | Etkileşim Alternatifi | ⚠️ Kısmi | Tutamaç hem fare hem dokunmatik (touch) olaylarını desteklemektedir; ancak klavye alternatifi henüz eksiktir. |
| **MS-10** | Hareket Azaltma | ❌ Kaldı | CSS içinde \`@media (prefers-reduced-motion: reduce)\` kuralı bulunmamakta; otomatik telefon döndürme animasyonu durdurulmamaktadır. |
| **MS-11** | SCORM Uyumluluğu | ➖ Uygulanamaz | Materyal Seti hattında SCORM şartı aranmaz; puan kırmaz. |
| **MS-12** | Dış Bağımlılık & Çevrimdışı | ⚠️ Kısmi | \`index.html\` içinde harici KaTeX CDN ve Google Fonts bağlantıları bulunmaktadır. İnternetsiz kurum ağında formül dizgisi kırılabilir. |
| **MS-13** | Kütüphane Açılışı & Hata Yakalama | ⚠️ Kısmi | WebGL desteği veya harici kütüphane çökmesi durumunda kullanıcıya görsel fallback/hata mesajı gösterilmemektedir. |

    // Configure Mermaid
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        primaryColor: '#8b5cf6',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#a855f7',
        lineColor: '#94a3b8',
        secondaryColor: '#1e222d',
        tertiaryColor: '#161922'
      }
    });

    // Custom marked renderer to wrap tables and format callouts with robust type checks
    const renderer = new marked.Renderer();

    // Wrap tables inside our custom scrollable card container
    renderer.table = function(header, body) {
      const h = typeof header === 'string' ? header : (header?.header || '');
      const b = typeof body === 'string' ? body : (header?.rows || '');
      return `
        <div class="table-wrapper">
          <table>
            <thead>${h}</thead>
            <tbody>${b}</tbody>
          </table>
        </div>
      `;
    };

    // Custom blockquote to handle GitHub/Obsidian style callouts: > [!IMPORTANT]
    renderer.blockquote = function(tokenOrQuote) {
      let quote = '';
      if (typeof tokenOrQuote === 'string') {
        quote = tokenOrQuote;
      } else if (tokenOrQuote && typeof tokenOrQuote === 'object') {
        quote = tokenOrQuote.text || tokenOrQuote.raw || '';
        if (this.parser && tokenOrQuote.tokens) {
          try {
            quote = this.parser.parse(tokenOrQuote.tokens);
          } catch(e) {
            quote = tokenOrQuote.text || '';
          }
        }
      }

      // Check for [!IMPORTANT], [!NOTE], [!WARNING], [!TIP]
      const importantMatch = quote && quote.match(/\[!IMPORTANT\]/i);
      const noteMatch = quote && quote.match(/\[!NOTE\]/i);
      const warnMatch = quote && quote.match(/\[!WARNING\]/i);

      if (importantMatch) {
        const cleaned = quote.replace(/\[!IMPORTANT\](?:\s*<br\s*\/?>)?/i, '').trim();
        return `
          <div class="callout callout-important">
            <div class="callout-title">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
              IMPORTANT
            </div>
            <div>${cleaned}</div>
          </div>
        `;
      }

      if (noteMatch) {
        const cleaned = quote.replace(/\[!NOTE\](?:\s*<br\s*\/?>)?/i, '').trim();
        return `
          <div class="callout callout-note">
            <div class="callout-title">NOTE</div>
            <div>${cleaned}</div>
          </div>
        `;
      }

      if (warnMatch) {
        const cleaned = quote.replace(/\[!WARNING\](?:\s*<br\s*\/?>)?/i, '').trim();
        return `
          <div class="callout callout-warning">
            <div class="callout-title">WARNING</div>
            <div>${cleaned}</div>
          </div>
        `;
      }

      return `<blockquote>${quote}</blockquote>`;
    };

    // Code block renderer for Mermaid and standard code
    renderer.code = function(code, language) {
      const src = typeof code === 'string' ? code : (code?.text || '');
      const lang = typeof language === 'string' ? language : (code?.lang || '');

      if (lang === 'mermaid') {
        const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
        return `<div class="mermaid-block"><div class="mermaid" id="${id}">${src}</div></div>`;
      }
      return `<pre><code class="language-${lang || 'text'}">${escapeHtml(src)}</code></pre>`;
    };

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    marked.setOptions({
      renderer: renderer,
      breaks: true,
      gfm: true
    });

    async function renderMarkdownText(mdText, filename = '') {
      const renderContainer = document.getElementById('markdown-render');
      const emptyState = document.getElementById('empty-state');
      const titleBar = document.getElementById('doc-title-bar');
      const clearBtn = document.getElementById('clear-btn');

      if (!mdText || !mdText.trim()) {
        resetToEmptyState();
        return;
      }

      // Update filename display in header
      if (filename) {
        titleBar.innerText = filename;
        titleBar.classList.remove('hidden');
      } else {
        titleBar.classList.add('hidden');
      }
      clearBtn.classList.remove('hidden');
      clearBtn.classList.add('flex');

      // Protect math formulas ($...$ and $$...$$) from marked formatting
      const mathPlaceholders = [];
      let sanitizedMd = mdText.replace(/\$\$([\s\S]+?)\$\$/g, (match, expr) => {
        const ph = `@@MATH_BLOCK_${mathPlaceholders.length}@@`;
        try {
          mathPlaceholders.push(katex.renderToString(expr.trim(), { displayMode: true, throwOnError: false }));
        } catch (e) {
          mathPlaceholders.push(match);
        }
        return ph;
      });

      sanitizedMd = sanitizedMd.replace(/\$([^\$\n\r]+?)\$/g, (match, expr) => {
        const ph = `@@MATH_INLINE_${mathPlaceholders.length}@@`;
        try {
          mathPlaceholders.push(katex.renderToString(expr.trim(), { displayMode: false, throwOnError: false }));
        } catch (e) {
          mathPlaceholders.push(match);
        }
        return ph;
      });

      let parsed = marked.parse(sanitizedMd);

      // Restore KaTeX rendered HTML formulas
      parsed = parsed.replace(/@@MATH_(?:BLOCK|INLINE)_(\d+)@@/g, (match, idx) => {
        return mathPlaceholders[Number(idx)] || match;
      });

      renderContainer.innerHTML = parsed;

      // Switch views: hide empty state, show markdown render
      emptyState.classList.add('hidden');
      renderContainer.classList.remove('hidden');

      // Render Mermaid charts
      try {
        await mermaid.run({
          querySelector: '.mermaid'
        });
      } catch (err) {
        console.warn('Mermaid render notice:', err);
      }

      // Build Table of Contents
      buildTOC();

      // Scroll smoothly to top
      document.getElementById('scroll-container').scrollTop = 0;

      // Refresh Lucide icons
      lucide.createIcons();
    }

    function resetToEmptyState() {
      const renderContainer = document.getElementById('markdown-render');
      const emptyState = document.getElementById('empty-state');
      const titleBar = document.getElementById('doc-title-bar');
      const clearBtn = document.getElementById('clear-btn');
      const tocContainer = document.getElementById('toc-links');
      const tocCount = document.getElementById('toc-count');

      renderContainer.innerHTML = '';
      renderContainer.classList.add('hidden');
      emptyState.classList.remove('hidden');

      titleBar.innerText = '';
      titleBar.classList.add('hidden');
      clearBtn.classList.add('hidden');
      clearBtn.classList.remove('flex');

      tocContainer.innerHTML = `<div class="py-8 text-center text-slate-600 text-xs italic">Henüz belge yüklenmedi</div>`;
      tocCount.innerText = '0';
    }

    function buildTOC() {
      const tocContainer = document.getElementById('toc-links');
      const tocCount = document.getElementById('toc-count');
      const headings = document.querySelectorAll('#markdown-render h1, #markdown-render h2, #markdown-render h3');

      tocContainer.innerHTML = '';
      tocCount.innerText = headings.length;

      if (headings.length === 0) {
        tocContainer.innerHTML = `<span class="text-slate-500 italic">Başlık bulunamadı</span>`;
        return;
      }

      headings.forEach((heading, idx) => {
        const text = heading.innerText;
        const id = 'heading-' + idx;
        heading.id = id;

        const link = document.createElement('a');
        link.href = '#' + id;
        link.textContent = text;
        link.className = 'block py-1.5 px-2 rounded hover:bg-[#1d222e] hover:text-white transition truncate';

        // Indentation depending on tag
        if (heading.tagName === 'H1') {
          link.classList.add('font-semibold', 'text-slate-200');
        } else if (heading.tagName === 'H2') {
          link.classList.add('pl-4', 'text-slate-400');
        } else if (heading.tagName === 'H3') {
          link.classList.add('pl-7', 'text-slate-500', 'text-[11px]');
        }

        link.addEventListener('click', (e) => {
          e.preventDefault();
          heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        tocContainer.appendChild(link);
      });
    }

    // Initial load: start clean and empty
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      setupDragAndDrop();
      setupEventListeners();
    });

    function setupEventListeners() {
      // File Inputs (both header and hero)
      const fileInput = document.getElementById('file-input');
      const heroFileInput = document.getElementById('hero-file-input');

      const onFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          handleFile(file);
          e.target.value = ''; // Reset input to allow re-uploading same file
        }
      };

      fileInput.addEventListener('change', onFileChange);
      heroFileInput.addEventListener('change', onFileChange);

      // Paste Modal handlers
      const heroPasteBtn = document.getElementById('hero-paste-btn');
      const pasteModal = document.getElementById('paste-modal');
      const closeModalBtn = document.getElementById('close-modal-btn');
      const cancelPasteBtn = document.getElementById('cancel-paste-btn');
      const applyMarkdownBtn = document.getElementById('apply-markdown-btn');
      const rawInput = document.getElementById('raw-markdown-input');
      const resetSampleBtn = document.getElementById('reset-sample-btn');
      const loadSampleBtn = document.getElementById('load-sample-btn');
      const clearBtn = document.getElementById('clear-btn');

      const showModal = () => {
        pasteModal.classList.remove('hidden');
        pasteModal.classList.add('flex');
        rawInput.focus();
      };

      const hideModal = () => {
        pasteModal.classList.add('hidden');
        pasteModal.classList.remove('flex');
      };

      heroPasteBtn.addEventListener('click', showModal);
      closeModalBtn.addEventListener('click', hideModal);
      cancelPasteBtn.addEventListener('click', hideModal);

      applyMarkdownBtn.addEventListener('click', () => {
        const text = rawInput.value.trim();
        if (text) {
          renderMarkdownText(text, 'yapistirilan_belge.md');
          hideModal();
        }
      });

      resetSampleBtn.addEventListener('click', () => {
        rawInput.value = defaultSampleMarkdown;
      });

      loadSampleBtn.addEventListener('click', () => {
        renderMarkdownText(defaultSampleMarkdown, 'denetim_raporu.md');
      });

      clearBtn.addEventListener('click', () => {
        resetToEmptyState();
      });

      // Print button
      document.getElementById('print-btn').addEventListener('click', () => {
        window.print();
      });

      // Sidebar Toggle
      const tocBtn = document.getElementById('toggle-toc-btn');
      const sidebar = document.getElementById('toc-sidebar');
      tocBtn.addEventListener('click', () => {
        sidebar.classList.toggle('hidden');
      });

      // Theme Switcher (Dark / Light)
      const themeBtn = document.getElementById('theme-btn');
      const themeIcon = document.getElementById('theme-icon');
      themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        if (html.classList.contains('dark')) {
          html.classList.remove('dark');
          html.classList.add('light');
          document.body.style.backgroundColor = '#f8fafc';
          themeIcon.setAttribute('data-lucide', 'moon');
        } else {
          html.classList.add('dark');
          html.classList.remove('light');
          document.body.style.backgroundColor = '#0f1115';
          themeIcon.setAttribute('data-lucide', 'sun');
        }
        lucide.createIcons();
      });
    }

    function setupDragAndDrop() {
      const overlay = document.getElementById('drop-overlay');
      let dragCounter = 0;

      window.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragCounter++;
        overlay.classList.remove('opacity-0');
        overlay.classList.add('opacity-100');
      });

      window.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter <= 0) {
          dragCounter = 0;
          overlay.classList.remove('opacity-100');
          overlay.classList.add('opacity-0');
        }
      });

      window.addEventListener('dragover', (e) => {
        e.preventDefault();
      });

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragCounter = 0;
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');

        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          const file = e.dataTransfer.files[0];
          handleFile(file);
        }
      });
    }

    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const content = event.target.result;
        renderMarkdownText(content, file.name);
      };
      reader.readAsText(file);
    }
  </script>
